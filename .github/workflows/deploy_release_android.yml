name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        default: "2"
      version_minor:
        description: Version minor
        default: "0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Critical Libraries
        run: |
          sudo apt update -qq
          # Instalamos las dependencias que el log reportó como faltantes
          sudo apt install -y gettext mono-complete ninja-build cmake libusb-1.0-0-dev pkg-config

      - name: Check Patch (Zombie Fix Verification)
        run: |
          echo "--- VERIFICANDO CÓDIGO C++ ---"
          TARGET_FILE=$(find . -name "VulkanRenderer.cpp")
          if [ -z "$TARGET_FILE" ]; then
            echo "ERROR: No se encontró VulkanRenderer.cpp"
            exit 1
          fi
          echo "Archivo localizado en: $TARGET_FILE"
          # Buscamos nuestra modificación para el Xiaomi 14T Pro
          grep "BC5_UNORM" "$TARGET_FILE" || echo "ADVERTENCIA: El parche no parece estar aplicado en este archivo."

      - name: Build Cemu (Full Diagnostic)
        run: |
          # Encontrar carpeta de construcción dinámicamente
          ANDROID_PATH=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          cd "$ANDROID_PATH"
          chmod +x gradlew
          
          # Limpieza de rastro de compilaciones anteriores
          ./gradlew clean
          rm -rf .externalNativeBuild .cxx app/.cxx app/build
          
          # Compilar con visibilidad total de errores de C++
          ./gradlew assembleRelease --stacktrace --info -Pandroid.display_cxx_logs=true

      - name: Post-Build Map
        if: always()
        run: |
          echo "--- MAPA DE ARCHIVOS RESULTANTES ---"
          find . -name "*.apk" || echo "No se encontró ningún APK generado."

      - name: Upload Artifact
        if: success()
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          mkdir -p upload
          find . -name "*.apk" -exec cp {} upload/Cemu-$VERSION.apk \;
          
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          ./ghr -u ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -token ${{ secrets.GITHUB_TOKEN }} v$VERSION upload/
          
