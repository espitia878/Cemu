name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        default: "2"
      version_minor:
        description: Version minor
        default: "0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install System Dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete ninja-build cmake

      - name: Build Cemu (Modo Diagnóstico Pro)
        run: |
          # 1. GPS de carpetas: Encuentra gradlew donde sea que esté
          ANDROID_DIR=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          echo "Proyecto detectado en: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          
          # 2. Borrón y cuenta nueva: Elimina basura de intentos anteriores
          chmod +x gradlew
          ./gradlew clean
          rm -rf .gradle .cxx app/.cxx app/build

          # 3. Compilación con reporte máximo
          # Esto nos dirá exactamente qué línea del código de los zombies falla
          ./gradlew assembleRelease --stacktrace --info -Pandroid.display_cxx_logs=true

      - name: Create Release
        if: success()
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          mkdir -p upload
          find . -name "*.apk" -exec mv {} upload/Cemu-$VERSION.apk \;
          
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          ./ghr -u ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -token ${{ secrets.GITHUB_TOKEN }} v$VERSION upload/
          
