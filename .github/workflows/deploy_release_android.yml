name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        default: "2"
      version_minor:
        description: Version minor
        default: "0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Build Tools
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete ninja-build cmake
          # VERIFICACIÓN: Confirmar herramientas para el log
          cmake --version
          ninja --version

      - name: Pre-Build Inspection (The "Sniffer")
        run: |
          echo "--- BUSCANDO ARCHIVOS CRÍTICOS ---"
          # Localiza el archivo del parche y verifica si el código está ahí
          VULKAN_FILE=$(find . -name "VulkanRenderer.cpp")
          echo "VulkanRenderer.cpp encontrado en: $VULKAN_FILE"
          if [ -z "$VULKAN_FILE" ]; then echo "ERROR: Archivo C++ no encontrado"; exit 1; fi
          
          # Verifica si el parche BC5 está aplicado antes de compilar
          grep -n "BC5_UNORM" "$VULKAN_FILE" || echo "ADVERTENCIA: Parche no detectado en el archivo"

      - name: Build Cemu (Deep Diagnostic Mode)
        run: |
          ANDROID_PATH=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          cd "$ANDROID_PATH"
          chmod +x gradlew
          
          # Limpieza total: Borrar rastros de compilaciones fallidas anteriores
          ./gradlew clean
          rm -rf .gradle .cxx app/.cxx app/build
          
          # COMPILACIÓN CON SENSORES ACTIVOS
          # -Pandroid.display_cxx_logs=true: Obliga a CMake a mostrar errores de C++
          # --stacktrace: Muestra dónde se rompe la cadena de comandos
          ./gradlew assembleRelease --stacktrace --info -Pandroid.display_cxx_logs=true

      - name: Post-Mortem Debug
        if: always() # Se ejecuta aunque falle para ver qué se alcanzó a crear
        run: |
          echo "--- ESTADO FINAL DEL PROYECTO ---"
          find . -name "*.apk" || echo "No se generó el APK"
          # Listar errores específicos de CMake si existen
          find . -name "cmake_libs_outputs" -type d || echo "No hay salida de librerías nativas"

      - name: Upload Artifact
        if: success()
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          mkdir -p upload
          find . -name "*.apk" -exec cp {} upload/Cemu-$VERSION.apk \;
          
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          ./ghr -u ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -token ${{ secrets.GITHUB_TOKEN }} v$VERSION upload/
          
