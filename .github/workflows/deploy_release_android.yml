name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        default: "2"
      version_minor:
        description: Version minor
        default: "0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: 📦 Instalar Dependencias del Sistema
        run: |
          sudo apt update -qq
          sudo apt install -y libusb-1.0-0-dev pkg-config ninja-build cmake gettext

      - name: 🛠️ Limpieza y Bypass (Astucia Técnica)
        run: |
          echo "Desactivando módulos de PC y limpiando rutas..."
          find . -name "CMakeLists.txt" -exec sed -i 's/pkg_check_modules(LIBUSB/# pkg_check_modules(LIBUSB/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i 's/find_package(libusb/# find_package(libusb/g' {} +
          
          MAIN_CMAKE=$(find . -maxdepth 2 -name "CMakeLists.txt" | head -n 1)
          sed -i '/cmake_minimum_required/d' "$MAIN_CMAKE"
          sed -i '1i cmake_minimum_required(VERSION 3.22)' "$MAIN_CMAKE"

            - name: 🏗️ Compilar APK (Suplantación de Identidad de Herramientas)
        run: |
          # 1. Asegurar la existencia de la versión compatible
          $ANDROID_HOME/tools/bin/sdkmanager "cmake;3.22.1"
          
          # 2. EL HIJACK (El golpe maestro)
          # Eliminamos cualquier rastro de la versión problemática
          sudo rm -rf /usr/local/lib/android/sdk/cmake/3.31.5
          
          # Creamos la carpeta de la 3.31.5 pero VACÍA
          sudo mkdir -p /usr/local/lib/android/sdk/cmake/3.31.5/bin
          
          # Enlazamos el ejecutable de la 3.22.1 DENTRO de la carpeta de la 3.31.5
          # Así, cuando Gradle crea que llama a la nueva, estará ejecutando la vieja.
          sudo ln -sf $ANDROID_HOME/cmake/3.22.1/bin/cmake /usr/local/lib/android/sdk/cmake/3.31.5/bin/cmake
          sudo ln -sf $ANDROID_HOME/cmake/3.22.1/bin/ninja /usr/local/lib/android/sdk/cmake/3.31.5/bin/ninja
          
          # 3. Configuración de Prioridad Absoluta
          # Escribimos local.properties usando rutas absolutas para no fallar
          echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" > ./src/android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/r26b" >> ./src/android/local.properties
          
          # 4. COMPILACIÓN DE ALTO RENDIMIENTO (Sin demonios)
          cd ./src/android
          chmod +x gradlew
          # Usamos --no-daemon para que no guarde basura en memoria entre intentos
          ./gradlew assembleRelease \
            --no-daemon \
            -Pandroid.extractNativeLibs=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" \
            --stacktrace
            

      - name: 📦 Cargar Artefacto
        if: success()
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          mkdir -p upload
          find . -name "*.apk" -not -path "*/build-cache/*" -not -path "*/intermediates/*" -exec cp {} upload/Cemu-Xiaomi-14TPro-v$VERSION.apk \;
          
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          ./ghr -u ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -token ${{ secrets.GITHUB_TOKEN }} v$VERSION upload/
          
