name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        default: "2"
      version_minor:
        description: Version minor
        default: "0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Build Tools
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete ninja-build cmake
          # VERIFICACIÓN: ¿Están instalados?
          cmake --version
          ninja --version

      - name: Inspect Source Code (Zombie Patch Check)
        run: |
          echo "--- REVISANDO EL PARCHE DE TEXTURAS ---"
          # Buscamos el archivo y mostramos las líneas del parche para confirmar que existen
          FILE_PATH=$(find . -name "VulkanRenderer.cpp")
          if [ -f "$FILE_PATH" ]; then
            echo "Archivo encontrado en: $FILE_PATH"
            grep -C 5 "BC5_UNORM" "$FILE_PATH" || echo "ADVERTENCIA: No se encontró la línea del parche BC5."
          else
            echo "ERROR CRÍTICO: No se encuentra VulkanRenderer.cpp"
            exit 1
          fi

      - name: Build Cemu (Full Verbose & Debug)
        run: |
          ANDROID_PATH=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          cd "$ANDROID_PATH"
          chmod +x gradlew
          
          # Limpieza total de caché de CMake (para evitar errores de versiones viejas)
          ./gradlew clean
          rm -rf .externalNativeBuild .cxx app/.cxx app/build
          
          # COMPILACIÓN CON TRAPAS DE ERROR
          # -Pandroid.display_cxx_logs=true: Muestra errores de C++ en el log de GitHub
          # --debug: Si hay un error de Java/Gradle, lo dirá todo
          ./gradlew assembleRelease --stacktrace --info -Pandroid.display_cxx_logs=true

      - name: Search and Debug APK
        if: always() # Se ejecuta aunque la compilación falle para ver qué se logró crear
        run: |
          echo "--- MAPA DE ARCHIVOS GENERADOS ---"
          find . -name "*.apk"
          find . -name "cmake_libs_outputs" -type d || echo "No se generaron librerías nativas"

      - name: Upload Artifact
        if: success()
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          mkdir -p upload
          find . -name "*.apk" -exec cp {} upload/Cemu-$VERSION.apk \;
          
          # Verificar si el archivo pesa lo que debe (un APK vacío es mala señal)
          ls -lh upload/
          
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          ./ghr -u ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -token ${{ secrets.GITHUB_TOKEN }} v$VERSION upload/
          
