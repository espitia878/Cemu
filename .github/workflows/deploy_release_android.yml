name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        default: "2"
      version_minor:
        description: Version minor
        default: "0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: 📦 Instalar Dependencias del Sistema
        run: |
          sudo apt update -qq
          sudo apt install -y libusb-1.0-0-dev pkg-config ninja-build cmake gettext

      - name: 🛠️ Parche de Emergencia (Versión Reforzada)
        run: |
          echo "Aplicando correcciones quirúrgicas..."
          
          # 1. Corregir CMakeLists.txt principal (usando find para mayor seguridad)
          MAIN_CMAKE=$(find . -maxdepth 2 -name "CMakeLists.txt" | head -n 1)
          if [ -f "$MAIN_CMAKE" ]; then
            sed -i '1i cmake_minimum_required(VERSION 3.22)' "$MAIN_CMAKE"
            echo "Versión mínima de CMake inyectada en $MAIN_CMAKE"
          fi
          
          # 2. Bypass total de libusb
          # Buscamos todos los archivos que mencionen libusb para comentarlos
          find . -name "CMakeLists.txt" -exec sed -i 's/pkg_check_modules(LIBUSB/# pkg_check_modules(LIBUSB/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i 's/libusb-1.0/# libusb-1.0/g' {} +
          echo "Bypass de libusb aplicado en todos los módulos."

      - name: 🔍 Verificar Parche de Texturas
        run: |
          echo "Verificando parche BC5_UNORM..."
          VULKAN_FILE=$(find . -name "VulkanRenderer.cpp")
          if [ -n "$VULKAN_FILE" ]; then
            grep "BC5_UNORM" "$VULKAN_FILE" || echo "AVISO: El parche de texturas no se detectó."
          fi

      - name: 🏗️ Compilar APK (Full Diagnostic)
        run: |
          # Localizamos gradlew automáticamente para evitar errores de ruta
          GRADLE_PATH=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          cd "$GRADLE_PATH"
          chmod +x gradlew
          
          ./gradlew clean
          rm -rf .externalNativeBuild .cxx app/.cxx app/build
          
          # Compilación con reporte detallado
          ./gradlew assembleRelease --stacktrace --info -Pandroid.display_cxx_logs=true

      - name: 📦 Cargar Artefacto
        if: success()
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          mkdir -p upload
          # Buscamos el APK recursivamente para evitar fallos de ruta en el comando cp
          find . -name "*.apk" -exec cp {} upload/Cemu-Optimized-$VERSION.apk \;
          
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          ./ghr -u ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -token ${{ secrets.GITHUB_TOKEN }} v$VERSION upload/
          
