name: Deploy experimental android release
on:
  workflow_dispatch:
    inputs:
      version_major:
        description: Version major
        default: "2"
      version_minor:
        description: Version minor
        default: "0"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: 📦 Instalar Dependencias del Sistema
        run: |
          sudo apt update -qq
          sudo apt install -y libusb-1.0-0-dev pkg-config ninja-build cmake gettext

      - name: 🛠️ Limpieza de Conflictos (Bypass LibUSB)
        run: |
          echo "Desactivando módulos de PC innecesarios..."
          # Buscamos y comentamos referencias a libusb que bloquean Android
          find . -name "CMakeLists.txt" -exec sed -i 's/pkg_check_modules(LIBUSB/# pkg_check_modules(LIBUSB/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i 's/find_package(libusb/# find_package(libusb/g' {} +

      - name: 🏗️ Compilar APK (Optimizado para Xiaomi 14T Pro)
        run: |
          # 1. Localización de gradlew
          GRADLE_PATH=$(find . -name "gradlew" -printf '%h\n' | head -n 1)
          cd "$GRADLE_PATH"
          chmod +x gradlew
          
          # 2. Limpieza radical de builds fallidos
          ./gradlew clean
          rm -rf .externalNativeBuild .cxx app/.cxx app/build
          
          # 3. COMPILACIÓN DE ALTO RENDIMIENTO
          # Forzamos CMake 3.22.1 y NDK específico para evitar el exit value 1
          ./gradlew assembleRelease \
            -Pandroid.library.variants.all.itemConfiguration.cmake.version="3.22.1" \
            -Pandroid.extractNativeLibs=true \
            -Pandroid.ndkVersion="26.1.10909125" \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms2g" \
            --stacktrace --info

      - name: 📦 Cargar Artefacto
        if: success()
        run: |
          VERSION="${{ inputs.version_major }}.${{ inputs.version_minor }}"
          mkdir -p upload
          # Buscamos el APK y lo renombramos con tu optimización
          find . -name "*.apk" -not -path "*/build-cache/*" -exec cp {} upload/Cemu-Xiaomi-14TPro-v$VERSION.apk \;
          
          # Herramienta de release
          wget -O ghr.tar.gz https://github.com/tcnksm/ghr/releases/download/v0.15.0/ghr_v0.15.0_linux_amd64.tar.gz
          tar xvzf ghr.tar.gz; rm ghr.tar.gz
          ./ghr -u ${{ github.repository_owner }} -r ${{ github.event.repository.name }} -token ${{ secrets.GITHUB_TOKEN }} v$VERSION upload/
          
